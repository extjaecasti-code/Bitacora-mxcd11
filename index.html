<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora MXCD11</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --y:#FFE600;--b:#2D3277;--bd:#1e2255;
  --bg:#f4f4f0;--s:#fff;--s2:#f8f8f5;
  --br:#e0e0d8;--br2:#c4c4bc;
  --t:#1a1a18;--t2:#58584f;--t3:#989890;
  --r:8px;
  --gn:#0f6e56;--gnb:#e1f5ee;
  --rd:#a32d2d;--rdb:#fcebeb;
  --am:#7a4f00;--amb:#fff8e1;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:14px;line-height:1.6}

.hdr{background:var(--b);color:#fff;padding:0 1.25rem;display:flex;align-items:center;gap:10px;height:50px;position:sticky;top:0;z-index:200}
.badge{background:var(--y);color:var(--b);font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;letter-spacing:.06em}
.hdr h1{font-size:14px;font-weight:500;flex:1}
.hbtn{display:flex;align-items:center;gap:4px;font-size:11px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:4px 10px;color:#fff;cursor:pointer;font-family:inherit}
.hbtn:hover{background:rgba(255,255,255,.22)}

.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;align-items:center;justify-content:center;padding:1rem}
.mbg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:1.5rem;width:min(440px,100%);box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal h2{font-size:16px;font-weight:600;margin-bottom:6px}
.modal .sub{font-size:13px;color:var(--t2);margin-bottom:14px;line-height:1.6}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.info{background:rgba(45,50,119,.07);border:1px solid rgba(45,50,119,.15);border-radius:var(--r);padding:9px 13px;font-size:12px;color:var(--b);line-height:1.6;margin-bottom:12px}
code{font-family:monospace;font-size:11px;background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px}

.wrap{max-width:760px;margin:0 auto;padding:1.25rem 1rem 4rem}

.tabs{display:flex;border-bottom:1.5px solid var(--br);margin-bottom:1.25rem}
.tab{padding:8px 18px;font-size:13px;border:none;background:none;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px;font-family:inherit}
.tab.on{color:var(--b);border-bottom-color:var(--b);font-weight:500}
.tab:hover:not(.on){color:var(--t)}
.pane{display:none}
.pane.on{display:block}

.card{background:var(--s);border:1px solid var(--br);border-radius:12px;padding:1.15rem 1.25rem;margin-bottom:1rem}
.ctitle{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}

label{font-size:13px;color:var(--t2);display:block;margin-bottom:4px}
textarea,input[type=text],input[type=email],input[type=password]{width:100%;border:1px solid var(--br);border-radius:var(--r);padding:9px 11px;font-size:14px;font-family:inherit;background:var(--s2);color:var(--t);transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:110px;line-height:1.65}
textarea:focus,input:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 3px rgba(45,50,119,.1);background:#fff}
textarea::placeholder,input::placeholder{color:var(--t3)}

.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:var(--r);border:1px solid var(--br2);background:#fff;color:var(--t);font-size:13px;font-family:inherit;cursor:pointer;transition:background .12s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.bb{background:var(--b);color:#fff;border-color:var(--b)}
.bb:hover{background:var(--bd)}
.by{background:var(--y);color:var(--b);border-color:#d9c400;font-weight:600}
.by:hover{background:#f0d800}
.bsm{padding:5px 11px;font-size:12px}
.bg2{border-color:transparent;color:var(--t2);background:transparent}
.bg2:hover{background:var(--bg);color:var(--t);border-color:var(--br)}
.bdel{border-color:transparent;color:var(--rd);background:transparent}
.bdel:hover{background:var(--rdb)}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.opt{border:1px solid var(--br);border-radius:var(--r);padding:12px;margin-bottom:10px;background:var(--s2);transition:border-color .15s}
.opt:hover{border-color:var(--b)}
.onum{font-size:11px;font-weight:600;color:var(--b);background:rgba(45,50,119,.09);padding:1px 9px;border-radius:20px;display:inline-block;margin-bottom:8px}
.obody{font-size:13px;white-space:pre-wrap;line-height:1.7;margin-bottom:10px}

.st{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r);font-size:12px}
.ok2{background:var(--gnb);color:var(--gn)}
.er{background:var(--rdb);color:var(--rd)}
.wa{background:var(--amb);color:var(--am)}

.sp{width:14px;height:14px;border:2px solid var(--br2);border-top-color:var(--b);border-radius:50%;animation:spin .65s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.lrow{display:flex;align-items:center;gap:10px;padding:1.25rem 0;color:var(--t2);font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--br);border-radius:20px;padding:3px 10px 3px 12px;font-size:12px;color:var(--t2)}
.cx{background:none;border:none;cursor:pointer;color:var(--t3);font-size:15px;line-height:1;padding:0 2px}
.cx:hover{color:var(--rd)}

.hi{border:1px solid var(--br);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.hih{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--s2);cursor:pointer}
.hih:hover{background:var(--bg)}
.him{flex:1;min-width:0}
.hid{font-size:11px;color:var(--t3)}
.his{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.tn{background:rgba(45,50,119,.1);color:var(--b)}
.tr{background:rgba(255,214,0,.3);color:#5a4a00}
.hib{display:none;padding:12px 13px;border-top:1px solid var(--br);background:#fff;font-size:13px;white-space:pre-wrap;line-height:1.7}
.hib.open{display:block}
.hito{font-size:11px;color:var(--t3);margin-top:8px;padding-top:8px;border-top:1px solid var(--br)}

hr.dv{border:none;border-top:1px solid var(--br);margin:1rem 0}
.row2{display:flex;gap:8px}
.row2 input{flex:1}
.empty{text-align:center;padding:3rem 1rem;color:var(--t3);font-size:13px}
</style>
</head>
<body>

<div class="hdr">
  <span class="badge">MXCD11</span>
  <h1>Bitácora diaria</h1>
  <button class="hbtn" onclick="openM('cfg')">⚙️ Configuración</button>
</div>

<!-- MODAL: CONFIG (Gemini Key + GitHub + Destinatarios) -->
<div class="mbg" id="m-cfg">
  <div class="modal" style="max-height:90vh;overflow-y:auto;">
    <h2>Configuración</h2>
    <p class="sub">Tus datos se guardan solo en este navegador.</p>

    <div class="ctitle" style="margin-top:4px;">Gemini API Key</div>
    <div class="info">Obtén tu clave gratis en <code>aistudio.google.com</code> → ícono de llave → Get API key</div>
    <input type="password" id="ak-inp" placeholder="AIzaSy...">

    <div class="ctitle" style="margin-top:16px;">Historial en GitHub</div>
    <div style="display:grid;gap:8px;margin-bottom:4px;">
      <div>
        <label>Usuario GitHub</label>
        <input type="text" id="gh-u" placeholder="extjaecasti-code">
      </div>
      <div>
        <label>Repositorio</label>
        <input type="text" id="gh-r" placeholder="bitacora-mxcd11">
      </div>
      <div>
        <label>Token GitHub <span style="font-size:11px;color:var(--t3);">(permiso repo)</span></label>
        <input type="password" id="gh-t" placeholder="ghp_...">
      </div>
    </div>

    <div class="ctitle" style="margin-top:16px;">Destinatarios del correo</div>
    <div class="row2">
      <input type="email" id="nemail" placeholder="correo@mercadolibre.com">
      <button class="btn bb bsm" onclick="addEmail()">+ Agregar</button>
    </div>
    <div id="echips" class="chips"></div>

    <div class="ctitle" style="margin-top:16px;">Asunto base</div>
    <input type="text" id="csubj" value="Bitácora diaria — MXCD11">

    <div class="mbtns">
      <button class="btn bg2 bsm" onclick="closeM('cfg')">Cancelar</button>
      <button class="btn bb bsm" onclick="saveCfg()">💾 Guardar</button>
    </div>
    <div id="cfg-st" style="margin-top:8px;"></div>
  </div>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on"  onclick="goTab('redactar')">✏️ Redactar</button>
    <button class="tab"     onclick="goTab('historial')">📋 Historial</button>
  </div>

  <!-- REDACTAR -->
  <div id="pane-redactar" class="pane on">
    <div class="card">
      <label>Escribe lo que hiciste hoy (casual, como lo tengas)</label>
      <textarea id="inp" placeholder="ej: fui a ver el escáner del muelle 5, era un cable suelto, ya quedó. También ayudé a Luis con la VPN, le reinicié el agente CCM y ya conectó..."></textarea>
      <div class="brow">
        <button class="btn by" id="btnref" onclick="reformular()">✨ Reformular con IA</button>
        <button class="btn bg2 bsm" onclick="limpiar()">🗑 Limpiar</button>
      </div>
    </div>

    <div id="seco" style="display:none;">
      <div class="card">
        <div class="ctitle">Elige la mejor versión</div>
        <div id="lopt" class="lrow" style="display:none;"><span class="sp"></span> Generando con Gemini…</div>
        <div id="opts"></div>
      </div>
    </div>

    <div id="secf" style="display:none;">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div class="ctitle" style="margin:0;">Mensaje final</div>
          <button class="btn bg2 bsm" onclick="document.getElementById('seco').scrollIntoView({behavior:'smooth'})">← Volver</button>
        </div>
        <textarea id="txtf" rows="11" style="min-height:190px;"></textarea>
        <hr class="dv">
        <div id="sendto"></div>
        <div class="brow" style="margin-top:10px;">
          <button class="btn bb" id="btnsend" onclick="enviar()">📤 Registrar en historial</button>
          <div id="sendst"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORIAL -->
  <div id="pane-historial" class="pane">
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn bsm" id="btnsync" onclick="pullGh()">☁️ Cargar desde GitHub</button>
      <button class="btn bsm bdel" onclick="clearLocal()">🗑 Limpiar local</button>
    </div>
    <div id="hist"></div>
  </div>
</div>

<script>
const LS='bitmxcd11_v6';
let cfg={recipients:[],subject:'Bitácora diaria — MXCD11'};
let history=[],threadId=null,threadDate=null;
let ghUser='',ghRepo='',ghToken='';
let _opts=[];

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(LS)||'{}');
    if(d.cfg)cfg=d.cfg;
    if(d.history)history=d.history;
    if(d.threadId)threadId=d.threadId;
    if(d.threadDate)threadDate=d.threadDate;
    if(d.ghUser)ghUser=d.ghUser;
    if(d.ghRepo)ghRepo=d.ghRepo;
    ghToken=localStorage.getItem('bitmx_ght')||'';
  }catch(e){}
}
function persist(){
  localStorage.setItem(LS,JSON.stringify({cfg,history,threadId,threadDate,ghUser,ghRepo}));
}
function getAk(){return localStorage.getItem('bitmx_ak')||'';}

// MODAL
function openM(id){
  document.getElementById('m-'+id).classList.add('open');
  if(id==='cfg'){
    document.getElementById('ak-inp').value=getAk();
    document.getElementById('gh-u').value=ghUser;
    document.getElementById('gh-r').value=ghRepo;
    document.getElementById('gh-t').value=ghToken;
    document.getElementById('csubj').value=cfg.subject;
    renderChips();
  }
}
function closeM(id){document.getElementById('m-'+id).classList.remove('open');}
document.querySelectorAll('.mbg').forEach(mb=>mb.addEventListener('click',e=>{if(e.target===mb)mb.classList.remove('open');}));

function saveCfg(){
  const ak=document.getElementById('ak-inp').value.trim();
  if(ak)localStorage.setItem('bitmx_ak',ak);
  ghUser=document.getElementById('gh-u').value.trim();
  ghRepo=document.getElementById('gh-r').value.trim();
  ghToken=document.getElementById('gh-t').value.trim();
  if(ghToken)localStorage.setItem('bitmx_ght',ghToken);
  cfg.subject=document.getElementById('csubj').value.trim()||cfg.subject;
  persist();
  const s=document.getElementById('cfg-st');
  s.innerHTML='<span class="st ok2">✓ Guardado</span>';
  setTimeout(()=>{s.innerHTML='';closeM('cfg');},1400);
}

// TABS
function goTab(n){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['redactar','historial'][i]===n));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  document.getElementById('pane-'+n).classList.add('on');
  if(n==='historial')renderHist();
}

// GITHUB
async function ghGetFile(path){
  const r=await fetch(`https://api.github.com/repos/${ghUser}/${ghRepo}/contents/${path}`,
    {headers:{Authorization:'token '+ghToken,Accept:'application/vnd.github.v3+json'}});
  if(r.status===404)return null;if(!r.ok)throw new Error('GitHub '+r.status);return r.json();
}
async function ghPut(path,content,sha){
  const body={message:'Bitácora: '+new Date().toLocaleString('es-MX'),content:btoa(unescape(encodeURIComponent(content)))};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${ghUser}/${ghRepo}/contents/${path}`,
    {method:'PUT',headers:{Authorization:'token '+ghToken,'Content-Type':'application/json'},body:JSON.stringify(body)});
  return r.ok;
}
async function pushGh(){
  if(!ghToken||!ghUser||!ghRepo)return false;
  try{const f=await ghGetFile('historial.json');return await ghPut('historial.json',JSON.stringify(history,null,2),f?.sha);}
  catch(e){return false;}
}
async function pullGh(){
  if(!ghToken||!ghUser||!ghRepo){alert('Configura GitHub en ⚙️ Configuración.');return;}
  const btn=document.getElementById('btnsync');btn.disabled=true;btn.textContent='⏳ Cargando…';
  try{
    const f=await ghGetFile('historial.json');if(!f){alert('No se encontró historial.json.');return;}
    const remote=JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g,'')))));
    const ids=new Set(history.map(h=>h.id));
    remote.forEach(e=>{if(!ids.has(e.id))history.push(e);});
    history.sort((a,b)=>b.id-a.id);persist();renderHist();btn.textContent='✓ Listo';
  }catch(e){alert('Error: '+e.message);}
  finally{btn.disabled=false;setTimeout(()=>{btn.textContent='☁️ Cargar desde GitHub';},2000);}
}

// REFORMULAR con Gemini
async function reformular(){
  const ak=getAk();
  if(!ak){openM('cfg');alert('Primero configura tu Gemini API Key.');return;}
  const txt=document.getElementById('inp').value.trim();
  if(!txt){alert('Escribe tu bitácora primero.');return;}
  const btn=document.getElementById('btnref');btn.disabled=true;btn.textContent='Generando…';
  document.getElementById('seco').style.display='block';
  document.getElementById('lopt').style.display='flex';
  document.getElementById('opts').innerHTML='';
  document.getElementById('secf').style.display='none';
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${ak}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:
`Eres asistente de redacción para Andre Jael Castillo Diaz, operador de TI en MXCD11 (centro de distribución Mercado Libre, México).
Reformula la siguiente bitácora en 3 versiones para correo al equipo.
REGLAS:
- Cada versión DEBE iniciar exactamente: "Hola Team,"
- Cada versión DEBE terminar exactamente: "Saludos,\nAndre Jael Castillo Diaz"
- Tono profesional pero cálido, como compañero de trabajo
- Conserva TODA la información técnica
- Opción 1: directa y concisa. Opción 2: detallada. Opción 3: casual/narrativa.
Responde SOLO JSON sin markdown ni bloques de código:
{"opciones":["texto1","texto2","texto3"]}
Bitácora:\n${txt}`}]}]})
    });
    if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.error?.message||'HTTP '+res.status);}
    const data=await res.json();
    const raw=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
    _opts=JSON.parse(raw.replace(/```json|```/g,'').trim()).opciones||[];
    document.getElementById('lopt').style.display='none';
    renderOpts(_opts);
  }catch(e){
    document.getElementById('lopt').style.display='none';
    document.getElementById('opts').innerHTML=`<p style="color:var(--rd);font-size:13px;">Error: ${e.message}</p>`;
  }finally{btn.disabled=false;btn.textContent='✨ Reformular con IA';}
}

function renderOpts(opts){
  document.getElementById('opts').innerHTML=opts.map((t,i)=>`
    <div class="opt">
      <span class="onum">Opción ${i+1}</span>
      <div class="obody">${esc(t)}</div>
      <button class="btn bsm bb" onclick="usarOpt(${i})">✓ Usar esta versión</button>
    </div>`).join('');
}
function usarOpt(i){
  document.getElementById('txtf').value=_opts[i];
  document.getElementById('secf').style.display='block';
  renderSendTo();
  setTimeout(()=>document.getElementById('secf').scrollIntoView({behavior:'smooth'}),50);
}
function renderSendTo(){
  const d=document.getElementById('sendto');
  if(!cfg.recipients.length){
    d.innerHTML=`<p class="st wa">⚠️ Sin destinatarios — configúralos en ⚙️</p>`;return;
  }
  d.innerHTML=`<div style="font-size:12px;color:var(--t2);margin-bottom:5px;">Para:</div>
    <div class="chips">${cfg.recipients.map(r=>`<span class="chip" style="padding:3px 12px;">${r}</span>`).join('')}</div>`;
}

// REGISTRAR
async function enviar(){
  const body=document.getElementById('txtf').value.trim();if(!body)return;
  const btn=document.getElementById('btnsend');btn.disabled=true;btn.textContent='Guardando…';
  document.getElementById('sendst').innerHTML='';

  const today=new Date().toISOString().split('T')[0];
  const isReply=threadDate===today&&!!threadId;
  if(!isReply){threadId='hilo_'+today+'_'+Date.now();threadDate=today;}

  const ds=new Date().toLocaleString('es-MX',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const sd=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
  const subject=isReply?`Re: ${cfg.subject} — ${sd}`:`${cfg.subject} — ${sd}`;

  const entry={id:Date.now(),threadId,isReply,date:ds,isoDate:new Date().toISOString(),subject,body,recipients:[...cfg.recipients]};
  history.unshift(entry);persist();

  const gOk=await pushGh();
  btn.disabled=false;btn.textContent='📤 Registrar en historial';

  const msg=isReply?'Agregado al hilo del día':'Registrado';
  const gm=gOk?' · guardado en GitHub ✓':(ghToken?' · GitHub: error ⚠️':' · sin GitHub configurado');
  document.getElementById('sendst').innerHTML=`<span class="st ok2">✓ ${msg}${gm}</span>`;
  setTimeout(()=>{limpiar();document.getElementById('sendst').innerHTML='';},3000);
}

// HISTORIAL
function renderHist(){
  const c=document.getElementById('hist');
  if(!history.length){c.innerHTML=`<div class="empty">📭 Aún no hay bitácoras registradas.</div>`;return;}
  c.innerHTML=history.map((h,i)=>`
    <div class="hi">
      <div class="hih" onclick="toggleHi(${i})">
        <div class="him"><div class="hid">${h.date}</div><div class="his">${esc(h.subject)}</div></div>
        <span class="hitag ${h.isReply?'tr':'tn'}">${h.isReply?'↩ Respuesta':'✉ Nuevo hilo'}</span>
      </div>
      <div class="hib" id="hb${i}">${esc(h.body)}
        ${h.recipients&&h.recipients.length?`<div class="hito">Para: ${h.recipients.join(', ')}</div>`:''}
      </div>
    </div>`).join('');
}
function toggleHi(i){document.getElementById('hb'+i).classList.toggle('open');}
function clearLocal(){
  if(!confirm('¿Borrar historial local? (GitHub no se modifica)'))return;
  history=[];threadId=null;threadDate=null;persist();renderHist();
}

// CHIPS DESTINATARIOS
function renderChips(){
  const c=document.getElementById('echips');
  c.innerHTML=cfg.recipients.length
    ?cfg.recipients.map((r,i)=>`<span class="chip">${r}<button class="cx" onclick="rmEmail(${i})">×</button></span>`).join('')
    :'<span style="font-size:12px;color:var(--t3);margin-top:4px;display:block;">Sin destinatarios aún.</span>';
}
function addEmail(){
  const inp=document.getElementById('nemail'),v=inp.value.trim().toLowerCase();
  if(!v||!v.includes('@')){alert('Correo inválido.');return;}
  if(cfg.recipients.includes(v)){alert('Ya está.');return;}
  cfg.recipients.push(v);inp.value='';renderChips();
}
function rmEmail(i){cfg.recipients.splice(i,1);renderChips();}

function limpiar(){
  document.getElementById('inp').value='';
  document.getElementById('seco').style.display='none';
  document.getElementById('secf').style.display='none';
